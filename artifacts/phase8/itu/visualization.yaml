question_map:
  - label: "Pregunta 2 — Hay dos definiciones de ITU complicada. ¿Cuál debe gobernar la vía?"
    related:
      - itu-r03-complicated-structural-definition
      - itu-r06-complicated-beyond-bladder-definition
  - label: "Pregunta 4 — ¿El citoquímico de orina tiene la excepción correcta (mujer, primer episodio, síntomas típicos)?"
    related:
      - itu-r07-urinalysis
  - label: "Pregunta 6 — ¿El urocultivo tiene la excepción correcta (primer episodio no complicado en mujer premenopáusica)?"
    related:
      - itu-r10-urine-culture
  - label: "Pregunta 7 — ¿Son correctos los tres umbrales de urocultivo positivo?"
    related:
      - itu-r11-culture-positive-spontaneous
      - itu-r12-culture-positive-symptomatic
      - itu-r13-culture-positive-new-catheter
  - label: "Preguntas 12-13 — ¿La imagen urgente y la modalidad según la alteración sospechada están bien representadas?"
    related:
      - itu-r18-urgent-imaging
      - itu-r19-contrast-ct
      - itu-r20-uro-ct
      - itu-r21-functional-ultrasound
  - label: "Pregunta 14 — ¿La ecografía renal en embarazo tiene las indicaciones correctas?"
    related:
      - itu-r22-pregnancy-ultrasound
  - label: "Pregunta 15 — ¿El tratamiento de bacteriuria asintomática queda restringido a embarazo y procedimientos de riesgo?"
    related:
      - itu-r23-asb-treatment-eligibility
  - label: "Pregunta 16 — ¿Las indicaciones de hospitalización son alternativas correctas?"
    related:
      - itu-r24-hospitalization
  - label: "Pregunta 17 — ITU alta: el protocolo la lista como indicación de hospitalización y también da tratamiento ambulatorio. ¿Cómo representarlo?"
    related:
      - itu-r29-upper-outpatient-treatment
      - itu-r24-hospitalization
  - label: "Pregunta 18 — El protocolo adulto conserva una mención pediátrica. ¿Qué hacer con ella?"
    related:
      - itu-r25-pediatric-hospitalization-source
  - label: "Preguntas 19-21 — Verifique la tabla general de tratamiento (alternativas, dosis, duraciones, notas al pie)."
    related:
      - itu-r27-lower-treatment
      - itu-r30-upper-inpatient-no-resistant-risk
      - itu-r31-upper-inpatient-resistant-no-shock
      - itu-r32-upper-inpatient-resistant-shock
  - label: "Pregunta 22 — Verifique la tabla de embarazo como una sola unidad (páginas 4 y 5)."
    related:
      - itu-r33-pregnancy-asb-treatment
      - itu-r34-pregnancy-lower-treatment
      - itu-r35-pregnancy-lower-prevention
      - itu-r36-pregnancy-upper-treatment
      - itu-r37-pregnancy-upper-prevention
  - label: "Pregunta 25 — Paso a vía oral y egreso: ¿son la misma decisión o decisiones distintas?"
    related:
      - itu-r26-oral-step-or-discharge
notes:
  - "El embarazo es un subflujo contextual: no es una etapa que todo paciente de ITU deba recorrer."
  - "La rama 'ITU alta ambulatoria' está BLOQUEADA y en conflicto con la indicación de hospitalización; requiere adjudicación clínica."
  - "Las dos definiciones de ITU complicada y la mención pediátrica permanecen como componentes fuera de la vía principal."
  - "Las flechas discontinuas rojas indican relaciones pendientes de revisión; las flechas continuas indican secuencia o rama propuesta."
