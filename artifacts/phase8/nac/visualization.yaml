question_map:
  - label: "Pregunta 8 — ¿Es correcta la regla compuesta de hemocultivos?"
    related:
      - nac-r11-blood-cultures
  - label: "Pregunta 13 — ¿La UCI/UCE es una decisión separada de la hospitalización?"
    related:
      - nac-r19-icu-direct
  - label: "Pregunta 14 — ¿Es correcta la segunda vía de UCI/UCE (3 o más criterios)?"
    related:
      - nac-r20-icu-three-criteria
  - label: "Pregunta 15 — Discrepancia BUN: narrativa (BUN > 30) vs flujograma (BUN > 20). ¿Cuál prevalece?"
    related:
      - nac-r11-blood-cultures
      - nac-r20-icu-three-criteria
  - label: "Pregunta 16 — Verifique fila por fila la tabla de tratamiento de la página 5."
    related:
      - nac-r21-treatment-no-risk
      - nac-r22-treatment-pseudomonas
      - nac-r23-treatment-mrsa-combined
      - nac-r24-treatment-mrsa-only
      - nac-r25-treatment-postviral
  - label: "Pregunta 17 — ¿Los factores de riesgo de gérmenes resistentes están completos?"
    related:
      - nac-r21-treatment-no-risk
      - nac-r22-treatment-pseudomonas
      - nac-r23-treatment-mrsa-combined
      - nac-r24-treatment-mrsa-only
  - label: "Pregunta 20 — ¿Los criterios de egreso deben leerse todos juntos?"
    related:
      - nac-r27-discharge
  - label: "Pregunta 4 — ¿La tomografía queda correctamente restringida?"
    related:
      - nac-r04-ct-inconclusive
  - label: "Pregunta 5 — Neutropenia febril: ¿tomografía simple en todos los pacientes con síntomas respiratorios?"
    related:
      - nac-r05-ct-neutropenia
  - label: "Pregunta 10 — ¿El panel molecular (FilmArray) es la práctica institucional?"
    related:
      - nac-r14-filmarray
  - label: "Pregunta 11 — ¿Todo derrame paraneumónico calificado va a toracentesis?"
    related:
      - nac-r17-pleural-study
notes:
  - "La etapa de tratamiento empírico usa evidencia visual de la página 5 (revisión manual requerida); permanece PENDIENTE DE REVISIÓN."
  - "La etapa de laboratorio se conecta a la hospitalización solo mediante una relación de apoyo; no se inventó una secuencia."
  - "Las flechas discontinuas rojas indican relaciones pendientes de revisión; las flechas continuas indican secuencia o rama propuesta."
