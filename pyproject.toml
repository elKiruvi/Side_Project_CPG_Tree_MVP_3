[project]
name = "Side_Project_CPG_Tree_MVP_3"
version = "0.1.0"
description = "Research prototype for transforming institutional clinical practice protocols into structured, traceable, versioned, and executable computational knowledge."
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    "pypdf>=6.19.0",
    "pyyaml>=6.0.2",
]

[project.urls]
repository = "https://github.com/elKiruvi/Side_Project_CPG_Tree_MVP_3"


[dependency-groups]
dev = [
    "pre-commit>=4.6.2", # Code linting and formatting
    "pytest>=9.1.1", # Testing framework
    "pytest-cookies>=0.7.0",
    "pytest-cov>=7.1.0",
    "cruft[pyproject]>=2.16.0",# Automated Cookiecutter template synchronization
]

#

[tool.uv]
package = true
default-groups = [
    "dev",
#
]

[tool.hatch.build.targets.wheel]
packages = ["src/cpg_tree"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[tool.coverage.paths]
source = ["src/"]

[tool.coverage.run]
source = ["src"]
omit = ["**/__init__.py"]
